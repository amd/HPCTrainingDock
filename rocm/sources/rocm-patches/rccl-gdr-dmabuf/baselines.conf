# rccl-gdr-dmabuf source baselines: GPU-direct RDMA registration on NICs with no
# peer-memory client (AICOMRCCL-1695).
#
# Backport of rocm-systems 9b68f262826a08a2da44e9317f30f030672904e9 (PR #9692, "restore HSA
# DMA-BUF export fallback when cuMem gate is on"). Each row pins the exact upstream source
# the shipped librccl was built from, so the rebuilt library differs from the stock one only
# by this patch.
#
# Format: ROCM_VERSION|GIT_URL|GIT_REF|PATCH_FILE|SRC_SUBDIR
#   Same schema and conventions as rccl-sb6033/baselines.conf; SRC_SUBDIR is "." for the
#   standalone ROCm/rccl layout and "projects/rccl" for the rocm-systems monorepo.
#
# WHICH RELEASES BELONG HERE, AND WHY ONLY THESE
#
# The defect is gated by `#if CUDA_VERSION >= 11070 || HIP_VERSION >= 71260540` in
# src/transport/net.cc. A release is affected only if its HIP_VERSION clears 71260540, i.e.
# ROCm 7.12.0 and newer. Below that gate the `#else` branch still compiles the HSA export
# path, so those lines do NOT carry this defect and must not be patched from here:
#   6.3.x (HIP 6.3.x), 6.4.x, 7.0.x, 7.1.x, 7.2.x (7.2.4 = HIP 70253211) are all below it.
# Those older lines DO fail GPU registration on bnxt_re on AAC6's SMC nodes, but for a
# different and still-unidentified reason: their regMr fails with EINVAL in userspace
# without ever entering the kernel driver (dmesg ib_umem_get counter stays at 0), which is
# not the behaviour this patch addresses. Do not add them here until that is root-caused.
#
# Fixed upstream, so NOT listed: 10.1.0 and afar-24.3.0-10.2.0 both ship RCCL 23007, which
# already contains PR #9692 and registers GPU memory correctly (verified on AAC6).
#
# 7.13.0's recorded build commit (3309c6114a) is not public; its RCCL source is pinned to
# the public therock-7.13 tag by the same bracketing argument documented in
# rccl-sb6033/baselines.conf.
#
# Not listed, and deliberately so: 7.12.0 and afar-23.1.0 are affected but NOT reproducibly
# patchable -- their recorded build commits are not public and cannot be bracketed, exactly
# as for rccl-sb6033. 7.14.0 / 7.14.1 are affected (RCCL 23004, reproduced on AAC6) but no
# public source pin has been established for them yet; add rows once one is.
7.13.0|https://github.com/ROCm/rocm-systems.git|therock-7.13|0001-rccl-gdr-dmabuf-7.13.patch|projects/rccl
afar-23.2.1|https://github.com/ROCm/rocm-systems.git|92b7431876|0001-rccl-gdr-dmabuf-7.13.patch|projects/rccl
