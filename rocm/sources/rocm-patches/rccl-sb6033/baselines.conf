# rccl-sb6033 source baselines: CVE-2026-43598 / AMD-SB-6033.
#
# Backport of rocm-systems ccba298bcfb644246e07b1137e948a4cab60eb29, the proxy-hardening
# commit AMD shipped in ROCm 7.14. Each row pins the exact upstream source the shipped
# librccl was built from, so the rebuilt library differs from the stock one only by this patch.
#
# Format: ROCM_VERSION|GIT_URL|GIT_REF|PATCH_FILE|SRC_SUBDIR
#   SRC_SUBDIR is "." for the standalone ROCm/rccl layout and "projects/rccl" for the
#   rocm-systems monorepo. Patches are cut with `git diff --relative`, so both apply with
#   -p1 from the rccl tree root.
#
# Provenance of the pins: for 6.3 through 7.2 RCCL still lived in the standalone ROCm/rccl
# repo, which carries a `rocm-<X.Y.Z>` tag per release; the NCCL version in each branch's
# makefiles/version.mk matches the "RCCL version N" string in the corresponding shipped
# library (7.0.x = 2.26.6, 7.1.x/7.2.x = 2.27.7, afar-23.2.1 = 2.28.3). Note that the
# "compiled with ROCm <hash>" string embedded in the library is the ROCm build-manifest
# commit, NOT the RCCL source commit: those hashes resolve in rocm-systems to commits where
# projects/rccl does not yet exist, so they cannot be used as the source pin for these lines.
#
# ROCm 6.3.4 has no `rocm-6.3.4` tag upstream; it pins the release branch head instead, which
# is byte-identical to the 6.3.x tags over every file this patch touches.
#
# Not listed, and deliberately so: ROCm 7.12.0, 7.13.0, afar-23.1.0 and the
# 7.14.0a20260612 nightly are vulnerable but NOT reproducibly patchable. Their recorded build
# commits (2bd1678d3d, 3309c6114a, 3937beba96) are not reachable from any public branch or tag
# in rocm-systems, so there is no source tree that differs from the shipped library only by
# this patch. Remediate those by retiring them in favour of 7.14.0 / 7.14.1 / afar-24.3.0,
# which are already installed and already carry the fix.

